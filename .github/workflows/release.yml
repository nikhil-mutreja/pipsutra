name: Publish Python distribution

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade ".[dev]" build twine
          ruff check .
          ruff format --check .
          pytest
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pipsutra
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install twine
        run: python -m pip install --upgrade twine requests
      - name: Mint OIDC token and publish to TestPyPI
        run: |
          # Exchange the GitHub OIDC token for a TestPyPI upload token
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=testpypi" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PYPI_TOKEN=$(curl -sS -X POST https://test.pypi.org/_/oidc/mint-token \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$OIDC_TOKEN\"}" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          python -m twine upload --verbose \
            --repository-url https://upload.test.pypi.org/legacy/ \
            -u __token__ -p "$PYPI_TOKEN" \
            dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pipsutra
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install twine
        run: python -m pip install --upgrade twine requests
      - name: Mint OIDC token and publish to PyPI
        run: |
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PYPI_TOKEN=$(curl -sS -X POST https://upload.pypi.org/legacy/_/oidc/mint-token \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$OIDC_TOKEN\"}" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          python -m twine upload --verbose \
            -u __token__ -p "$PYPI_TOKEN" \
            dist/*
