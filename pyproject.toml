[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pipsutra"
version = "0.1.0"
description = "Python dependency trust and security analysis, developed by Nikhil Mutreja"
readme = "README.md"
authors = [{ name = "Nikhil Mutreja" }]
maintainers = [{ name = "Nikhil Mutreja" }]
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["security", "dependencies", "supply-chain", "python", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "pydantic>=2.7,<3",
  "packaging>=24.0",
  "typer>=0.12,<1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
pipsutra = "pipsutra.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pipsutra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
